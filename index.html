<style>
:root{
  --bg:#05060d; --fg:#eef0f8; --surface:#0b0d17; --panel:#12141f; --line:#1d2130;
  --au:#ffb020; --bl:#3d7bff; --tl:#14e0b0; --mg:#ff3d9a; --rs:#ff5c5c;
  --sol:#14e0b0; --btc:#ffb020; --ltc:#3d7bff;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--au);color:#05060d}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#070911}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--bl),var(--mg));border-radius:8px}
:focus-visible{outline:2px solid var(--tl);outline-offset:2px}

/* ---------- SFONDO ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.bgfx .blobs{position:absolute;inset:-25%;background:
  radial-gradient(38% 32% at 14% 18%,rgba(61,123,255,.22),transparent 62%),
  radial-gradient(34% 30% at 86% 12%,rgba(255,61,154,.17),transparent 62%),
  radial-gradient(44% 38% at 72% 86%,rgba(20,224,176,.15),transparent 62%),
  radial-gradient(30% 30% at 22% 82%,rgba(255,176,32,.13),transparent 62%);
  animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(2%,-2%,0) scale(1.06)}
  100%{transform:translate3d(-2%,2%,0) scale(1.02)}
}
.bgfx .gridx{position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(61,123,255,.075) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,224,176,.055) 1px,transparent 1px);
  background-size:54px 54px;
  -webkit-mask-image:radial-gradient(circle at 50% 38%,#000 26%,transparent 86%);
  mask-image:radial-gradient(circle at 50% 38%,#000 26%,transparent 86%)}
.scan{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
  animation:scanm 7s linear infinite}
@keyframes scanm{to{background-position:0 6px}}
.vig{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(0,0,0,.74) 100%)}

/* ---------- LAYOUT ---------- */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px}
.sec{padding:46px 0}
.mono{font-family:var(--mono)}
.mut{color:#8b98ba}
.tiny{font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.h1{font-size:clamp(30px,7vw,60px);line-height:1.03;font-weight:700;letter-spacing:-.02em;margin:0}
.h2{font-size:clamp(21px,3.4vw,34px);line-height:1.15;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.h3{font-size:17px;font-weight:600;margin:0 0 4px}
.sub{color:#98a4c4;margin:6px 0 22px;max-width:70ch;font-size:15px}
.grad{background:linear-gradient(100deg,var(--au),var(--mg) 40%,var(--bl) 72%,var(--tl));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- SUPERFICI ---------- */
.panel{background:linear-gradient(180deg,rgba(18,20,31,.96),rgba(11,13,23,.96));
  border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card{background:linear-gradient(180deg,#12141f,#0c0e18);border:1px solid var(--line);
  border-radius:16px;padding:14px;position:relative;overflow:hidden;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-3px);border-color:rgba(255,176,32,.45);box-shadow:0 14px 40px rgba(0,0,0,.55)}
.brk{position:relative;padding:14px}
.brk>.c{position:absolute;width:14px;height:14px;border:2px solid var(--au);pointer-events:none;opacity:.85}
.brk>.c.tl{top:0;left:0;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.brk>.c.tr{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 4px 0 0}
.brk>.c.bl{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 4px}
.brk>.c.br{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 4px 0}
.brk>.c.tl,.brk>.c.tr{border-color:var(--tl)}
.brk>.c.bl,.brk>.c.br{border-color:var(--mg)}

/* ---------- PILL / BADGE ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(11,13,23,.85);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9fb0d4}
.pill.au{border-color:rgba(255,176,32,.5);color:var(--au);background:rgba(255,176,32,.08)}
.pill.bl{border-color:rgba(61,123,255,.5);color:#9dbcff;background:rgba(61,123,255,.08)}
.pill.tl{border-color:rgba(20,224,176,.5);color:var(--tl);background:rgba(20,224,176,.08)}
.pill.mg{border-color:rgba(255,61,154,.5);color:#ff9ccb;background:rgba(255,61,154,.08)}
.pill.rs{border-color:rgba(255,92,92,.5);color:#ffa8a8;background:rgba(255,92,92,.08)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tl);box-shadow:0 0 10px var(--tl);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}

/* ---------- BOTTONI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  transition:transform .15s,border-color .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:var(--au);box-shadow:0 10px 28px rgba(255,176,32,.16)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:linear-gradient(135deg,var(--au),#ff8a00);color:#0a0a0a;border-color:transparent;font-weight:700}
.btn.bl{border-color:rgba(61,123,255,.5);color:#cfe0ff;background:rgba(61,123,255,.1)}
.btn.tl{border-color:rgba(20,224,176,.5);color:#c6fff0;background:rgba(20,224,176,.09)}
.btn.mg{border-color:rgba(255,61,154,.5);color:#ffc9e4;background:rgba(255,61,154,.09)}
.btn.gh{background:rgba(11,13,23,.7)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:11px}

/* ---------- HEADER ---------- */
.hdr{position:fixed;top:0;left:0;right:0;z-index:40;
  background:rgba(5,6,13,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1180px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:700;letter-spacing:.06em;font-size:15px;display:flex;align-items:center;gap:9px;cursor:pointer}
.logo b{font-family:var(--mono);color:var(--au)}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav a{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:8px 10px;border-radius:9px;
  text-transform:uppercase;color:#9fb0d4;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,176,32,.1);color:var(--au)}
.nav a.on{color:var(--au);background:rgba(255,176,32,.09)}
.sysbar{border-bottom:1px solid var(--line);background:rgba(8,10,18,.9)}
.sysbar-in{max-width:1180px;margin:0 auto;padding:5px 16px;display:flex;gap:14px;align-items:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#7d8bab;overflow-x:auto;white-space:nowrap}
.sysbar-in b{color:var(--tl);font-weight:500}
.sysbar-in .warn{color:var(--au)}
.spacer{height:104px}

/* ---------- IMMAGINI ---------- */
.imwrap{position:relative;width:100%;overflow:hidden;border-radius:12px;
  background:radial-gradient(circle at 50% 50%,rgba(61,123,255,.09),rgba(5,6,13,.9));
  border:1px solid var(--line)}
.imwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px}

/* ---------- TERMINALE ---------- */
.term{background:#070911;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--mono)}
.term-h{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);
  background:rgba(18,20,31,.85);font-size:10.5px;letter-spacing:.12em;color:#8b98ba}
.term-h .d{width:9px;height:9px;border-radius:50%}
.term-b{padding:11px;font-size:11.5px;line-height:1.75;color:#8ff5cf;max-height:260px;overflow:auto}
.term-b .k{color:var(--au)} .term-b .b{color:#9dbcff} .term-b .m{color:#ff9ccb}
.term-b .g{color:#6d7b99}
.hexline{font-family:var(--mono);font-size:10.5px;color:#5f6d8c;letter-spacing:.06em;word-break:break-all}
.hash{font-family:var(--mono);font-size:11px;color:var(--tl);word-break:break-all}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed rgba(29,33,48,.9);font-family:var(--mono);font-size:11.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:#7d8bab;letter-spacing:.08em;text-transform:uppercase}
.kv span:last-child{text-align:right;color:#d8e0f5}

/* ---------- MARQUEE ---------- */
.marq{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(8,10,18,.7)}
.marq>div{display:inline-block;white-space:nowrap;padding:9px 0;animation:mq 34s linear infinite;
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#8ea0c8}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- OVERLAY ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,4,9,.78);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:61;
  background:#0a0c15;border-left:1px solid var(--line);transform:translateX(102%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.modal{position:fixed;inset:0;z-index:71;display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .22s}
.modal.on{opacity:1;pointer-events:auto}
.modal-b{background:#0b0d17;border:1px solid var(--line);border-radius:16px;padding:18px;
  max-width:760px;width:100%;max-height:88vh;overflow:auto;transform:translateY(12px);transition:transform .22s}
.modal.on .modal-b{transform:none}
.light{position:fixed;inset:0;z-index:75;background:rgba(2,3,8,.96);display:none;align-items:center;justify-content:center;padding:16px}
.light.on{display:flex}
.light img{max-width:96vw;max-height:84vh;object-fit:contain;border-radius:12px}
.menu{position:fixed;inset:0;z-index:90;background:rgba(4,5,11,.97);
  display:flex;flex-direction:column;gap:6px;padding:70px 22px 30px;transform:translateY(-102%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);overflow:auto}
.menu.on{transform:none}
.menu a{font-family:var(--mono);font-size:19px;letter-spacing:.08em;padding:13px 4px;
  border-bottom:1px solid var(--line);color:#c3cde6}
.menu a:hover{color:var(--au)}

/* ---------- FORM ---------- */
.inp{width:100%;min-height:44px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
  background:#0a0c15;font-family:var(--mono);font-size:13px;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:0;border-color:var(--tl);box-shadow:0 0 0 3px rgba(20,224,176,.12)}
.inp.bad{border-color:var(--rs);box-shadow:0 0 0 3px rgba(255,92,92,.12)}
.lbl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#8b98ba;margin:0 0 6px}
.err{color:#ffa8a8;font-size:11.5px;font-family:var(--mono);margin-top:5px}

/* ---------- STEP ---------- */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.step{flex:1;min-width:130px;padding:10px;border-radius:11px;border:1px solid var(--line);
  background:rgba(11,13,23,.6);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:#6f7d9c}
.step.on{border-color:var(--au);color:var(--au);background:rgba(255,176,32,.08)}
.step.done{border-color:rgba(20,224,176,.5);color:var(--tl)}

/* ---------- FAB / BADGE LIVE ---------- */
.fab{position:fixed;right:14px;bottom:16px;z-index:45;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab a{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--bl),var(--mg));border:1px solid rgba(255,255,255,.12);
  font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;transition:transform .18s}
.fab a:hover{transform:scale(1.09)}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;color:var(--tl)}

/* ---------- GLITCH ---------- */
.gl{position:relative;display:inline-block}
.gl::before,.gl::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none}
.gl::before{color:var(--mg);animation:g1 3.4s infinite steps(2)}
.gl::after{color:var(--tl);animation:g2 2.7s infinite steps(2)}
@keyframes g1{0%,92%,100%{transform:translate(0,0)}94%{transform:translate(-2px,1px)}96%{transform:translate(2px,-1px)}}
@keyframes g2{0%,90%,100%{transform:translate(0,0)}93%{transform:translate(2px,-1px)}97%{transform:translate(-2px,1px)}}

/* ---------- ROUTE FLASH ---------- */
.rflash{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,rgba(20,224,176,.16),transparent 40%)}
.rflash.on{animation:rf .42s ease-out}
@keyframes rf{0%{opacity:1}100%{opacity:0}}

/* ---------- SIGNAL BARS ---------- */
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:3px;background:var(--tl);border-radius:1px;animation:bar 1.1s ease-in-out infinite}
.bars i:nth-child(1){height:4px;animation-delay:0s}
.bars i:nth-child(2){height:7px;animation-delay:.12s}
.bars i:nth-child(3){height:10px;animation-delay:.24s}
.bars i:nth-child(4){height:12px;animation-delay:.36s}
@keyframes bar{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- BOOT / GATE ---------- */
.full{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;padding:20px}
#mcanvas{position:fixed;inset:0;z-index:0;opacity:.5;pointer-events:none}
.log{font-family:var(--mono);font-size:12px;line-height:1.85;color:#8ff5cf;min-height:210px}
.log .g{color:#5d6a88}
.gatebox{width:min(460px,94vw);text-align:center}
.keypad{display:flex;gap:6px;justify-content:center;margin:14px 0}
.keypad i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);background:#0a0c15}
.keypad i.on{background:var(--au);border-color:var(--au);box-shadow:0 0 12px rgba(255,176,32,.5)}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- SCANNER QR ---------- */
.qrbox{position:relative;background:#fff;border-radius:14px;padding:10px;width:min(260px,72vw);margin:0 auto}
.qrbox img{width:100%;height:auto;border-radius:8px}
.qrline{position:absolute;left:8px;right:8px;height:2px;background:linear-gradient(90deg,transparent,var(--mg),transparent);
  box-shadow:0 0 14px var(--mg);animation:qrs 2.6s ease-in-out infinite}
@keyframes qrs{0%,100%{top:8px}50%{top:calc(100% - 10px)}}

/* ---------- PROGRESS ---------- */
.prog{height:7px;border-radius:99px;background:#0a0c15;border:1px solid var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--bl));transition:width .5s linear}
.prog.low>i{background:linear-gradient(90deg,var(--rs),var(--au))}

/* ---------- BOOTERR ---------- */
.booterr{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(3,4,9,.94);padding:20px}
.booterr.on{display:flex}
.be-box{max-width:520px;width:100%;border:1px solid var(--rs);border-radius:16px;padding:20px;
  background:#0a0c15;font-family:var(--mono)}
.be-t{color:var(--rs);font-size:13px;letter-spacing:.2em;margin-bottom:10px}
.be-m{font-size:12.5px;color:#c3cde6;margin-bottom:16px;word-break:break-word}
.be-b{display:flex;gap:8px;flex-wrap:wrap}
.be-b button{min-height:42px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em}

/* ---------- TAB ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(11,13,23,.7);
  cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9fb0d4}
.tab.on{border-color:var(--au);color:var(--au);background:rgba(255,176,32,.1)}
.tab.tl.on{border-color:var(--tl);color:var(--tl);background:rgba(20,224,176,.1)}
.tab.mg.on{border-color:var(--mg);color:#ff9ccb;background:rgba(255,61,154,.1)}

/* ---------- ACCORDION ---------- */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:9px;background:rgba(11,13,23,.6)}
.acc-h{width:100%;text-align:left;padding:14px;background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;display:flex;justify-content:space-between;gap:12px;color:#d8e0f5}

const LANGS=[['it','🇮🇹','IT'],['en','🇬🇧','EN'],['es','🇪🇸','ES'],['de','🇩🇪','DE'],['fr','🇫🇷','FR']];
const LangCtx = createContext({lang:'it',setLang:()=>{},t:k=>k});

function makeT(lang){
  return (k,vars)=>{
    const d=DICT[lang]||DICT.it;
    let s = (d[k]!=null) ? d[k] : (DICT.it[k]!=null ? DICT.it[k] : k);
    if(vars){ Object.keys(vars).forEach(x=>{ s=s.split('{'+x+'}').join(vars[x]); }); }
    return s;
  };
}

function LangProvider({children}){
  const [lang,setLangState]=useState(()=>{ const l=S.get('ge-lang','it'); return DICT[l]?l:'it'; });
  const setLang=useCallback(l=>{ if(!DICT[l])return; setLangState(l); S.set('ge-lang',l); },[]);
  useEffect(()=>{ try{ document.documentElement.setAttribute('lang',lang); }catch(e){} },[lang]);
  const t=useMemo(()=>makeT(lang),[lang]);
  const v=useMemo(()=>({lang,setLang,t}),[lang,setLang,t]);
  return <LangCtx.Provider value={v}>{children}</LangCtx.Provider>;
}
const useT=()=>useContext(LangCtx).t;
const useLangV=()=>useContext(LangCtx);

function Scramble({text='',as='span',className='',style,delay=0}){
  const [s,setS]=useState(text);
  useEffect(()=>{
    let iv=null, to=null;
    const chars='!<>-_\\/[]{}=+*^?#01';
    to=setTimeout(()=>{
      let f=0; const tot=Math.max(6,text.length);
      iv=setInterval(()=>{
        f++;
        setS(text.split('').map((ch,i)=>{
          if(ch===' ') return ' ';
          if(i < (f/tot)*text.length) return ch;
          return chars[Math.floor(Math.random()*chars.length)];
        }).join(''));
        if(f>=tot){ clearInterval(iv); iv=null; setS(text); }
      },34);
    },delay);
    return ()=>{ if(iv)clearInterval(iv); if(to)clearTimeout(to); };
  },[text,delay]);
  const Tag=as;
  return <Tag className={className} style={style}>{s}</Tag>;
}

  return (

function Img({src,fallbacks,alt='',ratio='4/3',className='',style}){
  const list=useMemo(()=>[src].concat(fallbacks||[]).filter(Boolean),[src,(fallbacks||[]).join('|')]);
  const [i,setI]=useState(0);
  useEffect(()=>{ setI(0); },[src]);
  const cur=list[Math.min(i,list.length-1)];
  return (
    <div className={'imwrap '+(className||'')} style={Object.assign({aspectRatio:ratio},style||{})}>
      <img src={cur} alt={alt} draggable={false} loading="lazy" decoding="async"
        onError={()=>setI(v=> (v+1<list.length ? v+1 : v))}
        style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'contain'}}/>
    </div>
  );
}

function MatrixCanvas({active}){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current; if(!cv) return;
    const ctx=cv.getContext('2d'); if(!ctx) return;
    let raf=null, cols=0, ypos=[];
    const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789GUSTAVOEURO';
    function size(){
      cv.width=window.innerWidth; cv.height=window.innerHeight;
      cols=Math.floor(cv.width/16); ypos=new Array(cols).fill(0).map(()=>Math.random()*cv.height);
    }
    size();
    let last=0;
    function draw(ts){
      if(ts-last>62){
        last=ts;
        ctx.fillStyle='rgba(5,6,13,.16)'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.font='15px monospace';
        for(let i=0;i<cols;i++){
          const ch=chars[Math.floor(Math.random()*chars.length)];
          ctx.fillStyle = Math.random()>.94 ? '#ffb020' : (Math.random()>.7 ? '#3d7bff' : '#14e0b0');
          ctx.fillText(ch, i*16, ypos[i]);
          ypos[i] = ypos[i] > cv.height + 20 ? 0 : ypos[i] + 16;
        }
      }
      raf=requestAnimationFrame(draw);
    }
    raf=requestAnimationFrame(draw);
    window.addEventListener('resize',size);
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize',size); };
  },[active]);
  return null;
}

function norm(h){
  let s=String(h||'').replace(/^#/,'');
  if(!s || s==='/') return '/';
  if(s[0]!=='/') s='/'+s;
  return s.split('?')[0];
}
function useRoute(){
  const [r,setR]=useState(()=>norm(location.hash));
  useEffect(()=>{
    const h=()=>{ setR(norm(location.hash)); try{ window.scrollTo({top:0,behavior:'auto'}); }catch(e){ window.scrollTo(0,0); } };
    window.addEventListener('hashchange',h);
    return ()=>window.removeEventListener('hashchange',h);
  },[]);
  return r;
}
const go = p => { try{ location.hash='#'+p; }catch(e){} };

function Trust(){

  const [root,setRoot]=useState('');

    let lvl=Object.keys(COINS).map(k=>hashHex(COINS[k].addr,16));
    while(lvl.length>1){
      const nx=[];
      for(let i=0;i<lvl.length;i+=2) nx.push(hashHex(lvl[i]+(lvl[i+1]||lvl[i]),16));

    return lvl[0];

  const blocks=[['trust.how','trust.howB'],['trust.guar','trust.guarB'],['trust.rules','trust.rulesB'],

                  ['2024','Apertura ai trasferimenti PayPal P2P'],['2025','Merle root indirizzi pubblicata · mirror onion'],
                  ['2026','Verifica qualità pubblica con media reali']];
  return (

          <div className="hash" style={{fontSize:14}}>{root}</div>

            <CopyBtn value={root} label="COPIA ROOT"/>
            <button className="btn sm gh" onClick={()=>setRoot(root===merkle?'':hashHex(root+Date.now(),16))}>{t('trust.verify')}</button>
          </div>
          <div className="tiny mut mono" style={{marginTop:10}}>
            {Object.keys(COINS).map(k=>(
              <div key={k}>{k} → {hashHex(COINS[k].addr,16)}</div>
            ))}
          </div>
        </Bracket>
      </Section>

      <Section title={t('trust.pgp')}>
        <div className="grid g2">
          <Bracket className="panel">
            <div className="tiny mut mono">FINGERPRINT</div>
            <div className="hash" style={{fontSize:13,marginTop:6}}>{IDENT.pgp}</div>
            <div className="row" style={{marginTop:12}}>
              <CopyBtn value={IDENT.pgp.replace(/\s+/g,' ')} label="COPIA FINGERPRINT"/>

          <Term title="pgp --verify">

            <div><span className="b">$</span> ok_</div>
          </Term>
        </div>
      </Section>

      <Section title={t('trust.onion')}>

  const [step,setStep]=useState(0);
  const [method,setMethod]=useState('crypto');
  const [f,setF]=useState({name:'',addr:'',city:'',zip:'',country:'',phone:'',notes:'',email:'',email2:''});
  const [err,setErr]=useState({});
  const [processing,setProcessing]=useState(false);
  const [order,setOrder]=useState(null);

  const onlyPP = cart.length>0 && cart.every(i=>i.kind==='pp');
  const hasPP = cart.some(i=>i.kind==='pp');

  const draft=useMemo(()=>hashHex(cart.map(i=>i.uid).join('')+total,24),[cart,total]);
  const session=useMemo(()=>hashHex(String(Date.now())+Math.random(),24),[]);

  const set=(k,v)=>{ setF(s=>({...s,[k]:v})); setErr(e=>({...e,[k]:''})); };

  const validate=()=>{
    const e={};
    if(!onlyPP){
      if(!f.name.trim()) e.name=t('co.errReq');
      if(!f.addr.trim()) e.addr=t('co.errReq');
      if(!f.city.trim()) e.city=t('co.errReq');
      if(!f.zip.trim()) e.zip=t('co.errReq');
    }
    if(hasPP || onlyPP){
      const okEmail=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim());
      if(!okEmail) e.email=t('co.errEmail');
      if(f.email.trim().toLowerCase()!==f.email2.trim().toLowerCase()) e.email2=t('co.errMatch');
    }
    setErr(e);
    return Object.keys(e).length===0;
  };

  const makeCode=()=> 'GST-'+cart.map(i=>Math.round(i.price)).join('-')+'-'+rand4();

  const confirm=()=>{
    const code=makeCode();
    const o={
      code, date:nowStamp(), total,
      items:cart.map(i=>({title:i.title,price:i.price,qty:i.qty})),
      method,
      checksum:hashHex(code+total+cart.length,32),
      draft, session, email:hasPP?f.email:''
    };
    const all=S.get('ge-orders',[]); const arr=Array.isArray(all)?all:[];
    arr.unshift(o); S.set('ge-orders',arr.slice(0,50));
    setOrder(o);
  };

  const receiptText=o=>[
    '=== GUSTAVOEURO · RICEVUTA ===',
    'CODICE ORDINE : '+o.code,
    'DATA          : '+o.date,
    'METODO        : '+o.method.toUpperCase(),
    '--------------------------------',
    ...o.items.map(i=>i.title+' × '+i.qty+'  →  '+money(i.price*i.qty)),
    '--------------------------------',
    'TOTALE        : '+money(o.total),
    'CHECKSUM      : '+o.checksum,
    'DRAFT ID      : '+o.draft,
    'SESSION ID    : '+o.session,
    'PGP           : '+IDENT.pgp,
    'TELEGRAM      : '+IDENT.tg,
    '==============================='
  ].join('\n');

  if(cart.length===0 && !order){
    return (
      <Section title={t('co.title')} sub={t('co.sub')}>
        <div className="panel" style={{maxWidth:520}}>
          <div className="mono mut">{t('co.empty')}</div>
          <button className="btn pri" style={{marginTop:12}} onClick={()=>go('/cash')}>{t('co.go')} →</button>
        </div>
      </Section>
    );
  }

  const steps=[t('co.s1'),t('co.s2'),t('co.s3'),t('co.s4')];

  return (
    <Section title={t('co.title')} sub={t('co.sub')}>
      <div className="steps">
        {steps.map((s,i)=>(
          <div key={s} className={'step '+(step===i?'on':(step>i?'done':''))}>{i+1}. {s}</div>
        ))}
      </div>

      <div className="grid g2" style={{alignItems:'start'}}>
        <div className="grid" style={{gap:16}}>

          {/* ---------- STEP 0 DATI ---------- */}
          {step===0 && (
            <Fragment>
              {onlyPP ? (
                <Bracket className="panel" style={{borderColor:'rgba(20,224,176,.45)'}}>
                  <span className="pill tl"><span className="dot"/>{t('co.noShip')}</span>
                  <p className="mut" style={{fontSize:13.5,marginTop:10}}>{t('co.payInfo')}</p>
                  <div style={{marginTop:10}}>
                    <label className="lbl">{t('co.email')}</label>
                    <input className={'inp '+(err.email?'bad':'')} value={f.email} onChange={e=>set('email',e.target.value)} placeholder="nome@email.com"/>
                    {err.email && <div className="err">{err.email}</div>}
                    <label className="lbl" style={{marginTop:10}}>{t('co.email2')}</label>
                    <input className={'inp '+(err.email2?'bad':'')} value={f.email2} onChange={e=>set('email2',e.target.value)} placeholder="nome@email.com"/>
                    {err.email2 && <div className="err">{err.email2}</div>}
                  </div>
                </Bracket>
              ) : (
                <Fragment>
                  <div className="panel">
                    <div className="tiny mut mono" style={{marginBottom:10}}>▸ {t('co.shipT')}</div>
                    <div className="grid" style={{gap:10}}>
                      <div><label className="lbl">{t('co.name')}</label>
                        <input className={'inp '+(err.name?'bad':'')} value={f.name} onChange={e=>set('name',e.target.value)}/>
                        {err.name && <div className="err">{err.name}</div>}</div>
                      <div><label className="lbl">{t('co.addr')}</label>
                        <input className={'inp '+(err.addr?'bad':'')} value={f.addr} onChange={e=>set('addr',e.target.value)}/>
                        {err.addr && <div className="err">{err.addr}</div>}</div>
                      <div className="row">
                        <div style={{flex:1,minWidth:140}}><label className="lbl">{t('co.city')}</label>
                          <input className={'inp '+(err.city?'bad':'')} value={f.city} onChange={e=>set('city',e.target.value)}/>
                          {err.city && <div className="err">{err.city}</div>}</div>
                        <div style={{width:110}}><label className="lbl">{t('co.zip')}</label>
                          <input className={'inp '+(err.zip?'bad':'')} value={f.zip} onChange={e=>set('zip',e.target.value)}/>
                          {err.zip && <div className="err">{err.zip}</div>}</div>
                      </div>
                      <div className="row">
                        <div style={{flex:1,minWidth:140}}><label className="lbl">{t('co.country')}</label>
                          <input className="inp" value={f.country} onChange={e=>set('country',e.target.value)} placeholder="IT"/></div>
                        <div style={{flex:1,minWidth:140}}><label className="lbl">{t('co.phone')}</label>
                          <input className="inp" value={f.phone} onChange={e=>set('phone',e.target.value)} placeholder="+39"/></div>
                      </div>
                      <div><label className="lbl">{t('co.notes')} ({t('common.optional')})</label>
                        <textarea className="inp" rows="2" value={f.notes} onChange={e=>set('notes',e.target.value)}/></div>
                    </div>
                  </div>

                  {hasPP && (
                    <Bracket className="panel" style={{borderColor:'rgba(255,176,32,.45)'}}>
                      <span className="pill au">{t('co.mixedT')}</span>
                      <p className="mut" style={{fontSize:13.5,marginTop:8}}>{t('co.payInfo')}</p>
                      <label className="lbl" style={{marginTop:8}}>{t('co.email')}</label>
                      <input className={'inp '+(err.email?'bad':'')} value={f.email} onChange={e=>set('email',e.target.value)}/>
                      {err.email && <div className="err">{err.email}</div>}
                      <label className="lbl" style={{marginTop:10}}>{t('co.email2')}</label>
                      <input className={'inp '+(err.email2?'bad':'')} value={f.email2} onChange={e=>set('email2',e.target.value)}/>
                      {err.email2 && <div className="err">{err.email2}</div>}
                    </Bracket>
                  )}
                </Fragment>
              )}
            </Fragment>
          )}

          {/* ---------- STEP 1 VERIFICA ---------- */}
          {step===1 && (
            <Fragment>
              <Bracket className="panel">
                <div className="row" style={{marginBottom:10}}>
                  <span className="pill tl"><span className="dot"/>{t('co.verifyT')}</span>
                  <span className="pill bl mono">SHA-LIKE</span>
                </div>
                <div className="tiny mut mono" style={{marginBottom:6}}>{t('co.ledger')}</div>
                <div className="term" style={{padding:10}}>
                  {cart.map((i,n)=>(
                    <div key={i.uid} className="hexline" style={{marginBottom:4}}>
                      <span style={{color:'var(--au)'}}>#{pad(n+1)}</span> {i.title} ×{i.qty} · {money(i.price*i.qty)} · <span className="hash">{hashHex(i.uid+i.price,24)}</span>
                    </div>
                  ))}
                </div>
                <div className="kv" style={{marginTop:12}}><span>{t('co.total')}</span><span className="mono" style={{color:'var(--au)'}}>{money(total)}</span></div>
                <div className="kv"><span>{t('co.draft')}</span><span className="hash">{draft}</span></div>
                <div className="kv"><span>{t('co.session')}</span><span className="hash">{session}</span></div>
                <div className="kv"><span>{t('co.ts')}</span><span className="mono">{nowStamp()}</span></div>
                <div className="kv"><span>{t('co.checksum')}</span><span className="hash">{hashHex(draft+session+total,32)}</span></div>
              </Bracket>

              <Bracket className="panel">
                <div className="tiny mut mono" style={{marginBottom:8}}>{t('co.sig')}</div>
                <div className="term" style={{padding:10}}>
                  <div className="g">-----BEGIN PGP SIGNATURE-----</div>
                  <div className="hexline">{hashHex(draft+'sig1',64)}</div>
                  <div className="hexline">{hashHex(draft+'sig2',64)}</div>
                  <div className="g">-----END PGP SIGNATURE-----</div>
                </div>
                <div className="tiny mut mono" style={{marginTop:8}}>{IDENT.pgp}</div>
              </Bracket>

              <OrderConsole items={cart} total={total}/>
            </Fragment>
          )}

          {/* ---------- STEP 2 PAGAMENTO ---------- */}
          {step===2 && (
            <Fragment>
              <div className="tabs">
                <button className={'tab tl '+(method==='crypto'?'on':'')} onClick={()=>setMethod('crypto')}>{t('pay.crypto')} · {t('pay.fees0')}</button>
                <button className={'tab '+(method==='sepa'?'on':'')} onClick={()=>setMethod('sepa')}>{t('pay.sepa')} · +10%</button>
                <button className={'tab mg '+(method==='amazon'?'on':'')} onClick={()=>setMethod('amazon')}>{t('pay.amazon')} · +20%</button>
              </div>
              {method==='crypto' && <CryptoPay amount={total}/>}
              {method==='sepa' && <SepaPay amount={total}/>}
              {method==='amazon' && <AmazonPay amount={total}/>}
            </Fragment>
          )}

          {/* ---------- STEP 3 CONFERMA ---------- */}
          {step===3 && order && (
            <Bracket className="panel" style={{borderColor:'rgba(20,224,176,.5)'}}>
              <div className="row" style={{marginBottom:12}}>
                <span className="pill tl"><span className="dot"/>✓ {t('co.thanks')}</span>
                <span className="pill au mono">{order.code}</span>
              </div>
              <div className="kv"><span>{t('co.ts')}</span><span className="mono">{order.date}</span></div>
              <div className="kv"><span>{t('co.method')}</span><span className="mono">{order.method.toUpperCase()}</span></div>
              <div className="kv"><span>{t('co.total')}</span><span className="mono" style={{color:'var(--au)'}}>{money(order.total)}</span></div>
              <div className="kv"><span>{t('co.checksum')}</span><span className="hash">{order.checksum}</span></div>
              <p className="mut" style={{fontSize:13.5,marginTop:12}}>{t('co.saved')}</p>
              <div className="row" style={{marginTop:10}}>
                <button className="btn pri" onClick={()=>dl('ricevuta-'+order.code+'.txt',receiptText(order))}>{t('co.receipt')}</button>
                <a className="btn bl" href={IDENT.tg} target="_blank" rel="noopener noreferrer">{t('common.open_tg')} ↗</a>
                <button className="btn gh" onClick={()=>go('/track')}>{t('nav.track')} →</button>
              </div>
              <div style={{marginTop:16}}>
                <Term title="order.final">
                  <div><span className="k">$</span> order --commit</div>
                  <div className="g">→ code: {order.code}</div>
                  <div className="g">→ status: CONFERMATO</div>
                  <div className="g">→ checksum: {order.checksum}</div>
                  <div><span className="b">$</span> done_</div>
                </Term>
              </div>
            </Bracket>
          )}
        </div>

        {/* ---------- RIEPILOGO ---------- */}
        <div className="panel" style={{position:'sticky',top:120}}>
          <div className="tiny mut mono" style={{marginBottom:10}}>▸ {t('nav.cart')} · {cart.length} {t('common.items')}</div>
          {cart.map(i=>(
            <div key={i.uid} className="kv"><span>{i.title} ×{i.qty}</span><span className="mono">{money(i.price*i.qty)}</span></div>
          ))}
          <div className="kv" style={{marginTop:8}}><span><b>{t('co.total')}</b></span><span className="mono" style={{color:'var(--au)'}}><b>{money(total)}</b></span></div>

          <div className="grid" style={{gap:8,marginTop:14}}>
            {step>0 && <button className="btn gh" onClick={()=>setStep(s=>s-1)}>← {t('common.back')}</button>}
            {step===0 && <button className="btn pri" onClick={()=>{ if(validate()) setStep(1); }}>{t('co.proceed')} →</button>}
            {step===1 && <button className="btn pri" onClick={()=>setStep(2)}>{t('co.method')} →</button>}
            {step===2 && <button className="btn pri" onClick={()=>{ setProcessing(true); setTimeout(()=>{ confirm(); setProcessing(false); setStep(3); clear(); },1800); }}>{t('co.confirmT')} →</button>}
            {step===3 && <button className="btn tl" onClick={()=>{ clear(); setStep(0); setOrder(null); go('/'); }}>HOME →</button>}
          </div>

          <div className="row" style={{marginTop:14}}>
            <span className="pill tl">PGP</span>
            <span className="pill bl">CHECKSUM</span>
            <span className="pill au">TRACCIATO</span>
          </div>
        </div>
      </div>

      <div className={'modal '+(processing?'on':'')}>
        <div className="modal-b" style={{maxWidth:380,textAlign:'center'}}>
          <div className="spin"/>
          <div className="h3 mono" style={{marginTop:14}}>{t('co.processing')}</div>
          <div className="tiny mut mono" style={{marginTop:6}}>{hashHex(String(Date.now()),16)}</div>
        </div>
      </div>
    </Section>
  );
}

/* ------------------------------------------------------------------ *
 *  CART CONTEXT
 * ------------------------------------------------------------------ */
const CartCtx = createContext({cart:[],add:()=>{},setQty:()=>{},remove:()=>{},clear:()=>{},total:0});

function CartProvider({children}){
  const [cart,setCart]=useState(()=>{ const c=S.get('ge-cart',[]); return Array.isArray(c)?c:[]; });
  useEffect(()=>{ S.set('ge-cart',cart); },[cart]);
  const add=useCallback(it=>{
    setCart(c=>{
      const arr=Array.isArray(c)?c:[];
      const ex=arr.find(x=>x.pid===it.pid);
      if(ex) return arr.map(x=>x.pid===it.pid?{...x,qty:x.qty+1}:x);
      return arr.concat([Object.assign({},it,{uid:hashHex(it.pid+Date.now()+Math.random(),10),qty:1})]);
    });
  },[]);
  const setQty=useCallback((uid,d)=>{
    setCart(c=>(Array.isArray(c)?c:[]).map(x=>x.uid===uid?{...x,qty:Math.max(1,x.qty+d)}:x));
  },[]);
  const remove=useCallback(uid=>setCart(c=>(Array.isArray(c)?c:[]).filter(x=>x.uid!==uid)),[]);
  const clear=useCallback(()=>setCart([]),[]);
  const total=useMemo(()=>(Array.isArray(cart)?cart:[]).reduce((a,i)=>a+i.price*i.qty,0),[cart]);
  const v=useMemo(()=>({cart:Array.isArray(cart)?cart:[],add,setQty,remove,clear,total}),[cart,add,setQty,remove,clear,total]);
  return <CartCtx.Provider value={v}>{children}</CartCtx.Provider>;
}

/* ------------------------------------------------------------------ *
 *  ERROR BOUNDARY
 * ------------------------------------------------------------------ */
class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(e){ return {err:e}; }
  componentDidCatch(){ try{ window.__GE_ERR && window.__GE_ERR('React error boundary'); }catch(e){} }
  render(){
    if(this.state.err){
      return (
        <div className="full">
          <div className="be-box" style={{borderColor:'var(--rs)'}}>
            <div className="be-t">▚ RUNTIME ERROR</div>
            <div className="be-m">{String(this.state.err && this.state.err.message || 'Errore')}</div>
            <div className="be-b">
              <button onClick={()=>this.setState({err:null})}>RIPROVA</button>
              <button onClick={()=>{ try{ localStorage.removeItem('ge-cart'); }catch(e){} location.reload(); }}>RESET + RICARICA</button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ------------------------------------------------------------------ *
 *  SHELL
 * ------------------------------------------------------------------ */
function Page({route}){
  switch(route){
    case '/cash': return <Cash/>;
    case '/paypal': return <Paypal/>;
    case '/quality': return <Quality/>;
    case '/trust': return <Trust/>;
    case '/faq': return <Faq/>;
    case '/track': return <Track/>;
    case '/feedback': return <Feedback/>;
    case '/privacy': return <Legal ns="priv"/>;
    case '/terms': return <Legal ns="terms"/>;
    case '/cookies': return <Legal ns="cook"/>;
    case '/checkout': return <Checkout/>;
    case '/gate': return <Home/>;
    default: return <Home/>;
  }
}

function Shell({route}){
  const t=useT();
  const {cart,total,setQty,remove}=useContext(CartCtx);
  const [menu,setMenu]=useState(false);
  const [drawer,setDrawer]=useState(false);
  const [flash,setFlash]=useState(false);

  useEffect(()=>{ setFlash(true); const to=setTimeout(()=>setFlash(false),430); return ()=>clearTimeout(to); },[route]);
  useEffect(()=>{ setMenu(false); },[route]);

  return (
    <Fragment>
      <Header route={route} cartCount={cart.length} onCart={()=>setDrawer(true)} onMenu={()=>setMenu(true)} menuOpen={menu}/>
      <Menu open={menu} onClose={()=>setMenu(false)} route={route}/>
      <Drawer open={drawer} onClose={()=>setDrawer(false)} cart={cart} setQty={setQty} remove={remove}
        total={total} onCheckout={()=>go('/checkout')}/>
      <div className={'rflash '+(flash?'on':'')} aria-hidden="true"/>

      <div className="spacer"/>
      <main className="wrap">
        <Page route={route}/>
      </main>

      <div className="fab">
        <a href={IDENT.tg} target="_blank" rel="noopener noreferrer" title="Telegram">TG</a>
        <button className="btn gh" style={{width:48,height:48,borderRadius:'50%',padding:0}} onClick={()=>setDrawer(true)} title={t('nav.cart')}>🛒</button>
      </div>

      <Footer/>
    </Fragment>
  );
}

/* ------------------------------------------------------------------ *
 *  APP
 * ------------------------------------------------------------------ */
function App(){
  const route=useRoute();
  const [booted,setBooted]=useState(()=>S.sget('ge-boot','')==='1');
  const [authed,setAuthed]=useState(()=>S.sget('ge-in','')==='1');

  useEffect(()=>{
    window.__GE_MOUNTED=true;
    const el=document.getElementById('booterr'); if(el) el.classList.remove('on');
  },[]);

  if(!booted) return <Boot onDone={()=>{ S.sset('ge-boot','1'); setBooted(true); if(norm(location.hash)==='/'||!location.hash) go('/gate'); }}/>;
  if(!authed) return <Gate onOk={()=>{ S.sset('ge-in','1'); setAuthed(true); go('/'); }}/>;

  return <Shell route={route}/>;
}

/* ------------------------------------------------------------------ *
 *  MOUNT
 * ------------------------------------------------------------------ */
try{
  const root=document.getElementById('root');
  ReactDOM.createRoot(root).render(
    <ErrorBoundary>
      <LangProvider>
        <CartProvider>
          <App/>
        </CartProvider>
      </LangProvider>
    </ErrorBoundary>
  );
}catch(e){
  window.__GE_ERR && window.__GE_ERR(e && e.message);
}
