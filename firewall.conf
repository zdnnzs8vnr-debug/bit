# ============================================================
#  GUSTAVOEURO · firewall.conf
#  Include questo file dentro il blocco http{} di nginx.conf:
#      include /etc/nginx/firewall.conf;
# ============================================================

# ---------- ZONE ----------
limit_req_zone  $binary_remote_addr zone=ge_req:10m      rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ge_strict:10m   rate=5r/s;
limit_req_zone  $binary_remote_addr zone=ge_checkout:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=ge_conn:10m;
limit_req_zone  $server_name        zone=ge_global:10m   rate=400r/s;

# ---------- BAD BOT / SCANNER ----------
map $http_user_agent $is_bad_bot {
    default 0;
    "~*nikto"            1;
    "~*sqlmap"           1;
    "~*nmap"             1;
    "~*masscan"          1;
    "~*wpscan"           1;
    "~*zgrab"            1;
    "~*python-requests"  1;
    "~*Go-http-client"   1;
    "~*curl/7"           1;
    "~*libwww-perl"      1;
    "~*scrapy"           1;
    "~*HEAD"             0;
}

# ---------- METODI AMMESSI ----------
map $request_method $is_bad_method {
    default 1;
    GET  0;
    HEAD 0;
    POST 0;
    OPTIONS 0;
    PUT    1;
    DELETE 1;
    TRACE  1;
    PATCH  1;
    CONNECT 1;
}

# ---------- BLACKLIST ROTTE ----------
map $request_uri $is_probe {
    default 0;
    "~*\.env"            1;
    "~*\.git"            1;
    "~*/wp-login"        1;
    "~*/wp-admin"        1;
    "~*/phpmyadmin"      1;
    "~*/adminer"         1;
    "~*/vendor/"         1;
    "~*\.php$"           1;
    "~*\.sql$"           1;
    "~*\.bak$"           1;
    "~*\.zip$"           1;
}

