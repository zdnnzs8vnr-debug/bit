# ============================================================
#  GUSTAVOEURO · nginx.conf (VPS / reverse proxy)
#  TLS 1.2 + 1.3, header di sicurezza, SPA fallback, rate limit
# ============================================================
user  www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset utf-8;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    client_max_body_size 8m;
    client_body_timeout 20s;
    client_header_timeout 20s;

    # ---------- LOG ----------
    log_format json_combined escape=json
      '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method",'
      '"u":"$request_uri","s":$status,"rt":"$request_time","ua":"$http_user_agent",'
      '"ref":"$http_referer"}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ---------- GZIP ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
      text/plain text/css text/xml text/javascript
      application/javascript application/json application/xml
      application/manifest+json image/svg+xml;

    # ---------- LIMIT ----------
    limit_req_zone  $binary_remote_addr zone=ge_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ge_conn:10m;

    # ---------- BAD BOTS ----------
    map $http_user_agent $is_bad_bot {
        default 0;
        "~*(nikto|sqlmap|nmap|masscan|wpscan|zgrab|python-requests|Go-http-client|curl/7)" 1;
    }

    # ---------- HTTP -> HTTPS ----------
    server {
        listen 80;
        listen [::]:80;
        server_name gustavoeuro.com www.gustavoeuro.com;
        return 301 https://gustavoeuro.com$request_uri;
    }

    # ---------- HTTPS ----------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name gustavoeuro.com;

        root /var/www/gustavoeuro;
        index index.html;

        ssl_certificate     /etc/letsencrypt/live/gustavoeuro.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gustavoeuro.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ---------- HEADER SICUREZZA ----------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://i.ibb.co https://api.qrserver.com; connect-src 'self' https://api.qrserver.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

        # ---------- BLOCCO DOTFILE (tranne .well-known) ----------
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------- SECURITY.TXT ----------
        location = /.well-known/security.txt {
            default_type text/plain;
            add_header Cache-Control "public, max-age=86400";
        }

        # ---------- ASSET CACHE ----------
        location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ~* \.(css|js)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
        location = /manifest.webmanifest {
            types { application/manifest+json webmanifest; }
            expires 1d;
        }
        location = /sw.js {
            add_header Cache-Control "public, max-age=0, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        # ---------- RATE LIMIT SU ROTTE SENSIBILI ----------
        location ~ ^/(checkout|pay|track) {
            limit_req zone=ge_req burst=40 nodelay;
            limit_conn ge_conn 20;
            try_files $uri $uri/ /index.html;
        }

        # ---------- SPA FALLBACK ----------
        location / {
            limit_req zone=ge_req burst=60 nodelay;
            limit_conn ge_conn 40;

            if ($is_bad_bot = 1) { set $bot 1; }

            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # ---------- ERRORI ----------
        error_page 404 /404.html;
        error_page 403 /404.html;
        error_page 500 502 503 504 /404.html;
        location = /404.html { internal; }
    }
}
